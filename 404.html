<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskForge</title>
    <script>
        // GitHub Pages SPA fallback: /login, /app deep links don't exist as files.
        // Redirect to root; router.js re-resolves the intended view.
        const base = location.pathname.replace(/^\/([^/]+)\/.*/, '/$1/');
        location.replace(base);
    </script>
</head>
<body>
    <p>Redirecting to TaskForge...</p>
</body>
</html>
